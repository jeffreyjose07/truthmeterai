name: Publish Extension

# Push a tag like v2.0.0 to publish. The tag must match package.json's version.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  id-token: write   # OIDC trusted publishing to the VS Code Marketplace

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check tag matches package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }

      - run: npm run lint
      - run: npm run test:unit
      - run: xvfb-run -a npm run test:e2e
        env:
          VSCODE_VERSION: stable

      - name: Package for the VS Code Marketplace
        run: npx vsce package --out truthmeter.vsix

      # Trusted publishing (GitHub OIDC): no stored secret. Requires the Trusted Publishing policy
      # on the Marketplace publisher page (owner jeffreyjose07, repo truthmeterai, workflow
      # publish.yml). Renaming this file or the repo breaks it.
      - name: Publish to VS Code Marketplace (OIDC trusted publishing)
        run: npx vsce publish --oidc --packagePath truthmeter.vsix --skip-duplicate

      # Open VSX (Cursor, Windsurf, VSCodium, Antigravity...) uses a different publisher id.
      - name: Package for Open VSX
        run: |
          jq '.publisher = "jeffreyjose07"' package.json > package.json.tmp && mv package.json.tmp package.json
          npx vsce package --out truthmeter-ovsx.vsix
          git checkout package.json

      - name: Publish to Open VSX
        run: npx ovsx publish truthmeter-ovsx.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" truthmeter.vsix --title "$GITHUB_REF_NAME" --notes-file <(awk '/^## /{n++} n==1' CHANGELOG.md) || gh release upload "$GITHUB_REF_NAME" truthmeter.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
